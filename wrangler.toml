name = "agent-playground-backend"
main = "dist/worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ----------------------------------------------------
# Development Environment
# ----------------------------------------------------
[env.dev]
name = "agent-playground-backend-dev"

[env.dev.vars]
ENVIRONMENT = "dev"
SUPABASE_URL = "https://kvxhozhsstdtlrqeaxgs.supabase.co"
FRONTEND_URL = "https://agent-playground-dev.bubbleindexone-dev.workers.dev/"

# Hyperdrive binding — Supabase Dev database
# For local development, set the untracked
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE environment variable.
[[env.dev.hyperdrive]]
binding = "HYPERDRIVE"
id = "a6387124dba5424dbe426cec2bf32716"

# ----------------------------------------------------
# Production Environment
# ----------------------------------------------------
[env.production]
name = "agent-playground-backend-prod"

[env.production.vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://egnpcdukuzckjxuwlypn.supabase.co"
FRONTEND_URL = "https://agent-playground.bubbleindexone-dev.workers.dev/"

# Hyperdrive binding — Supabase Production database
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "afad88bd09374ee8ae9bbd3b03de18ab"
