name = "agent-playground-backend"
main = "dist/worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ----------------------------------------------------
# Development Environment
# ----------------------------------------------------
[env.dev]
name = "agent-playground-backend-dev"

# Hyperdrive binding — Supabase Dev database
# localConnectionString is set in .dev.vars (git-ignored) for `wrangler dev`
[[env.dev.hyperdrive]]
binding = "HYPERDRIVE"
id = "a6387124dba5424dbe426cec2bf32716"

# ----------------------------------------------------
# Production Environment
# ----------------------------------------------------
[env.production]
name = "agent-playground-backend-prod"

# Hyperdrive binding — Supabase Production database
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "afad88bd09374ee8ae9bbd3b03de18ab"
