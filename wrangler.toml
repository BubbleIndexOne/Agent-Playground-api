name = "agent-playground-backend"
main = "src/main.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Migrations directory configuration (for migration scripts and tracking)
# migrations_dir = "migrations"

# ----------------------------------------------------
# Development Environment
# ----------------------------------------------------
[env.dev]
name = "agent-playground-backend-dev"

# Hyperdrive connection to Supabase Dev database
[[env.dev.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_DEV_HYPERDRIVE_ID"
localConnectionString = "postgresql://postgres.kvxhozhsstdtlrqeaxgs:CTnU6iLEuETfKUIS@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"

# Migration hook / command for development Supabase instance:
# Wrangler Hyperdrive routes database traffic to external Postgres (Supabase).
# Apply schema migrations via hook:
#   npm run migrate:dev OR wrangler hyperdrive sql-execute (when using direct execution)

# ----------------------------------------------------
# Production Environment
# ----------------------------------------------------
[env.prod]
name = "agent-playground-backend-prod"

# Hyperdrive connection to Supabase Prod database
[[env.prod.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_PROD_HYPERDRIVE_ID"
localConnectionString = "postgresql://postgres.egnpcdukuzckjxuwlypn:t5usnRNZBhV83Mha@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

# Migration hook / command for production Supabase instance:
# Apply schema migrations via hook:
#   npm run migrate:prod
