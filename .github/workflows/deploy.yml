name: Deploy Backend Service

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    uses: BubbleIndexOne/Build-Pipeline/.github/workflows/deploy.yml@main
    with:
      environment: dev
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    uses: BubbleIndexOne/Build-Pipeline/.github/workflows/deploy.yml@main
    with:
      environment: prod
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
