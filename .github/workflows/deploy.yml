name: Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    uses: BubbleIndexOne/Build-Pipeline/.github/workflows/deploy.yml@main
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
