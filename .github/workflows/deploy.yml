name: Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  migrate:
    name: Run Database Migrations
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Migrations
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            npm run migrate:prod
          else
            npm run migrate:dev
          fi
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  deploy-sandbox:
    name: Deploy Sandbox Worker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Deploy Sandbox Worker
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx wrangler deploy --config sandbox-worker/wrangler.toml --env production
          else
            npx wrangler deploy --config sandbox-worker/wrangler.toml --env dev
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy:
    name: Deploy to Cloudflare
    needs: [migrate, deploy-sandbox]
    uses: BubbleIndexOne/Build-Pipeline/.github/workflows/deploy.yml@main
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  e2e-test:
    name: Run Live E2E Verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run E2E Test Suite
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            export ENVIRONMENT="production"
            export BASE_URL="$PROD_URL"
            export ADMIN_KEY="$PROD_KEY"
            export TEST_USER_EMAIL="$PROD_EMAIL"
            export TEST_USER_PASSWORD="$PROD_PWD"
          else
            export ENVIRONMENT="dev"
            export BASE_URL="$DEV_URL"
            export ADMIN_KEY="$DEV_KEY"
            export TEST_USER_EMAIL="$DEV_EMAIL"
            export TEST_USER_PASSWORD="$DEV_PWD"
          fi
          node scripts/test-endpoints.js
        env:
          PROD_URL: ${{ secrets.PROD_BACKEND_URL }}
          PROD_KEY: ${{ secrets.PROD_ADMIN_SECRET_KEY }}
          PROD_EMAIL: ${{ secrets.PROD_TEST_USER_EMAIL }}
          PROD_PWD: ${{ secrets.PROD_TEST_USER_PASSWORD }}
          DEV_URL: ${{ secrets.DEV_BACKEND_URL }}
          DEV_KEY: ${{ secrets.DEV_ADMIN_SECRET_KEY }}
          DEV_EMAIL: ${{ secrets.DEV_TEST_USER_EMAIL }}
          DEV_PWD: ${{ secrets.DEV_TEST_USER_PASSWORD }}
