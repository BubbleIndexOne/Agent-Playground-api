# Reusable Workflow for Cloudflare Worker with Hyperdrive & Supabase
# Location in pipeline repo: pipeline-repo/.github/workflows/hyperdrive-deploy.yml
name: Deploy Cloudflare Worker with Hyperdrive

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment to deploy (e.g. dev or prod)"
      base_path:
        required: false
        type: string
        default: ""
        description: "Optional base path for build"
      run_migrations:
        required: false
        type: boolean
        default: true
        description: "Execute schema migrations against Supabase before deployment"
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      DATABASE_URL:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      HYPERDRIVE_ID:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Schema Migrations (Supabase PostgreSQL)
        if: ${{ inputs.run_migrations && secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          echo "Executing migrations for ${{ inputs.environment }} Supabase instance..."
          npm run migrate:${{ inputs.environment }}

      - name: Build Project
        run: |
          if [ -n "${{ inputs.base_path }}" ]; then
            npm run build -- --base "${{ inputs.base_path }}"
          else
            npm run build
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy Worker via Wrangler Hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ secrets.HYPERDRIVE_ID }}" ]; then
            EXTRA_ARGS="--var HYPERDRIVE_ID:${{ secrets.HYPERDRIVE_ID }}"
          fi

          wrangler deploy --env ${{ inputs.environment }} $EXTRA_ARGS

      - name: Sync Supabase Secrets to Worker
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Configuring Supabase secrets for Worker environment ${{ inputs.environment }}..."
          echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL --env ${{ inputs.environment }}
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env ${{ inputs.environment }}
